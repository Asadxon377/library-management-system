<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        
    <title>Add Book | Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
        

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            📚 Library Management
        </a>
    </div>
</nav>

<main class="container mt-5">

        
    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4"
                        th:text="${isUpdate ? 'Update Book' : 'Add Book'}">
                        Add Book
                    </h2>

                    <form th:action="${formAction}"
                          th:object="${book}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text"
                                   th:field="*{title}"
                                   class="form-control"
                                   placeholder="Enter book title"
                                   required>
                        </div>
                        <div class="text-danger"
                        th:if="${#fields.hasErrors('title')}"
                        th:errors="*{title}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ISBN</label>
                            <input type="text"
                                   th:field="*{isbn}"
                                   class="form-control"
                                   placeholder="Enter ISBN"
                                   required>
                        </div>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('isbn')}"
                             th:errors="*{isbn}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Publication Year</label>
                            <input type="number"
                                   th:field="*{publicationYear}"
                                   class="form-control"
                                   placeholder="e.g. 2024"
                                   required>
                        </div>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('publicationYear')}"
                             th:errors="*{publicationYear}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Author</label>

                            <select th:field="*{authorId}"
                                    class="form-select"
                                    required>

                                <option value="" disabled selected>
                                    Select an author
                                </option>

                                <option th:each="author : ${authors}"
                                        th:value="${author.id}"
                                        th:text="${author.name}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('authorId')}"
                                 th:errors="*{authorId}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Category</label>

                            <select th:field="*{categoryId}"
                                    class="form-select"
                                    required>

                                <option value="" disabled selected>
                                    Select a category
                                </option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('categoryId')}"
                                 th:errors="*{categoryId}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/books}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary"
                                    th:text="${isUpdate ? 'Update Book' : 'Add Book'}">
                                Add Book
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
        

</main>

</body>
</html>
