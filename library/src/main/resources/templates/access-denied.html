<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

       
  <title>Access Denied | Library Management</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    }

    .denied-card {
      max-width: 520px;
      border: none;
      border-radius: 20px;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
    }

    .lock-icon {
      font-size: 4rem;
    }
  </style>
       

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">
      📚 Library Management
    </a>
  </div>
</nav>

<main class="container d-flex justify-content-center align-items-center"
      style="min-height: calc(100vh - 56px);">

       
  <div class="card denied-card shadow-lg text-center p-5">

    <div class="lock-icon mb-3">
      🔒
    </div>

    <div class="error-code text-danger">
      403
    </div>

    <h1 class="fw-bold mt-3">
      Access Denied
    </h1>

    <p class="text-muted fs-5 mt-3">
      Sorry, you don't have permission to access this page.
    </p>

    <p class="text-muted">
      Your current account doesn't have the required role for this action.
    </p>

    <div class="d-flex justify-content-center gap-2 mt-4">

      <a th:href="@{/}"
         class="btn btn-primary px-4">
        🏠 Go Home
      </a>

      <a th:href="@{/books}"
         class="btn btn-outline-secondary px-4">
        📚 Books
      </a>

    </div>

  </div>
       

</main>

</body>
</html>
