<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books | Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            📚 Library Management
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link active" th:href="@{/books}">Books</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
            <a class="nav-link" th:href="@{/categories}">Categories</a>

            <div class="d-flex align-items-center ms-3">

    <span class="text-light me-3">
    👤 <span sec:authentication="name"></span>
    <span class="text-secondary mx-1">|</span>

    <span sec:authorize="hasRole('ADMIN')">ADMIN</span>
    <span sec:authorize="hasRole('MANAGER') and !hasRole('ADMIN')">MANAGER</span>
    <span sec:authorize="hasRole('USER') and !hasRole('MANAGER') and !hasRole('ADMIN')">USER</span>
</span>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Logout
                    </button>
                </form>

            </div>
        </div>

    </div>


</nav>

<main class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="fw-bold mb-1">Books</h1>
            <p class="text-muted mb-0">
                Manage all books in the library.
            </p>
        </div>

        <a th:href="@{/books/new}"
           class="btn btn-primary">
            + Add Book
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>ISBN</th>
                        <th>Publication Year</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="book : ${books}">

                        <td th:text="${book.id}">
                            1
                        </td>

                        <td class="fw-semibold"
                            th:text="${book.title}">
                            Book Title
                        </td>

                        <td th:text="${book.isbn}">
                            123456789
                        </td>

                        <td th:text="${book.publicationYear}">
                            2025
                        </td>

                        <td th:text="${book.authorName}">
                            Author Name
                        </td>

                        <td>
                        <span class="badge text-bg-secondary"
                              th:text="${book.categoryName}">
                            Category
                        </span>
                        </td>

                        <td>

                        <span th:if="${book.available}"
                              class="badge text-bg-success">
                            Available
                        </span>

                            <span th:unless="${book.available}"
                                  class="badge text-bg-danger">
                            Borrowed
                        </span>

                        </td>


                        <td class="text-end">

                            <span sec:authorize="hasRole('MANAGER')">
                                <a th:href="@{/books/update/{id}(id=${book.id})}"
                            class="btn btn-sm btn-outline-primary">
                                Update
                                </a>
                            </span>

                            <span sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/books/delete/{id}(id=${book.id})}"
                                    class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Are you sure you want to delete this book?')">
                             Delete
                                </a>
                            </span>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(books)}">

                        <td colspan="8"
                            class="text-center text-muted py-4">

                            No books found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</main>

</body>
</html>
